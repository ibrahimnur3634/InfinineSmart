<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Infinine Smart Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #020817, #0f172a 40%, #111827);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(30, 58, 95, 1);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(2, 6, 23, 0.5);
            padding: 28px 24px 24px;
        }
        .brand {
            text-align: center;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #0ea5e9);
            -webkit-background-clip: text;
            color: transparent;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 26px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 22px;
            font-size: 13px;
        }
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
        }
        input {
            width: 100%;
            background: #020817;
            border: 1px solid #1e3a5f;
            color: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            font: inherit;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(90deg, #22c55e, #16a34a);
            color: #03150b;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #1e3a5f;
            color: #dbeafe;
            margin-top: 10px;
        }
        .message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            display: none;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.1);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: block;
        }
        .helper {
            margin-top: 16px;
            text-align: center;
            color: #7dd3fc;
            font-size: 12px;
            cursor: pointer;
        }
        .meta {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand">INFININE</div>
        <h1>Admin Access</h1>
        <div class="subtitle">Only authorised internal personnel may access this area.</div>

        <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 0 0 18px;">
            <a href="index.html" target="_blank" style="display:inline-block; padding:7px 10px; border-radius:999px; text-decoration:none; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.35); color:#bae6fd; font-size:11px; font-weight:700;">Home</a>
            <a href="terms.html" target="_blank" style="display:inline-block; padding:7px 10px; border-radius:999px; text-decoration:none; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.35); color:#bbf7d0; font-size:11px; font-weight:700;">Terms</a>
            <a href="terms.pdf" download style="display:inline-block; padding:7px 10px; border-radius:999px; text-decoration:none; background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.35); color:#fecaca; font-size:11px; font-weight:700;">PDF</a>
            <a href="https://wa.me/254711922007?text=Hello%20Infinine%20Smart%20Solutions%2C%20I%20need%20help" target="_blank" style="display:inline-block; padding:7px 10px; border-radius:999px; text-decoration:none; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35); color:#a7f3d0; font-size:11px; font-weight:700;">WhatsApp</a>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="adminLoginForm">
            <div class="field">
                <label for="adminUsername">Username</label>
                <input id="adminUsername" type="text" placeholder="Enter username" required />
            </div>

            <div class="field">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" type="password" placeholder="Enter password" required />
            </div>

            <button class="btn btn-primary" type="submit">Login</button>
            <button class="btn btn-secondary" type="button" onclick="location.href='index.html'">Back to Home</button>
        </form>

        <div class="helper" onclick="requestReset()">Forgot password?</div>
        <div class="meta">Admin login only</div>
    </div>

    <script>
        const ADMIN_USERNAME = 'infininekenya';
        const ADMIN_PASSWORD = 'infininesmart';
        const WHATSAPP_NUMBER = '254759240255';
        const SESSION_KEY = 'infinineAdminSession';
        const RECOVERY_KEY = 'infinineAdminRecovery';
        const ADMIN_SESSION_TTL_MS = 10 * 60 * 1000;
        const TTL_MS = 10 * 60 * 1000;

        function isAdminLoggedIn() {
            const session = localStorage.getItem(SESSION_KEY);
            if (!session) return false;
            try {
                const parsed = JSON.parse(session);
                if (!parsed || parsed.username !== ADMIN_USERNAME || parsed.expiresAt <= Date.now()) {
                    localStorage.removeItem(SESSION_KEY);
                    return false;
                }
                return true;
            } catch (error) {
                localStorage.removeItem(SESSION_KEY);
                return false;
            }
        }

        function setSession() {
            localStorage.setItem(SESSION_KEY, JSON.stringify({
                username: ADMIN_USERNAME,
                expiresAt: Date.now() + ADMIN_SESSION_TTL_MS
            }));
        }

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message ' + type;
        }

        function renderDashboardIfLoggedIn() {
            if (isAdminLoggedIn()) {
                window.location.href = 'admn-dashboard.html';
                return;
            }
        }

        function requestReset() {
            const data = {
                username: ADMIN_USERNAME,
                password: ADMIN_PASSWORD,
                validUntil: Date.now() + TTL_MS,
                contactNumber: WHATSAPP_NUMBER,
                requestedAt: Date.now()
            };

            localStorage.setItem(RECOVERY_KEY, JSON.stringify(data));

            const message = encodeURIComponent(
                'Hello, I forgot my admin password and need the login details. Please assist me with the current username and password. ' +
                'This request is valid for 10 minutes.'
            );

            const whatsappLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + message;
            window.open(whatsappLink, '_blank');
            showMessage('Please contact the admin on WhatsApp at 0759240255 to request the login details.', 'success');
        }

        function validateRecoveryWindow() {
            const saved = localStorage.getItem(RECOVERY_KEY);
            if (!saved) return false;
            try {
                const parsed = JSON.parse(saved);
                return parsed && parsed.validUntil > Date.now();
            } catch (error) {
                return false;
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                setSession();
                window.location.href = 'admn-dashboard.html';
                return;
            }

            showMessage('Invalid username or password. Use the admin credentials only.', 'error');
        });

        renderDashboardIfLoggedIn();
    </script>
</body>
</html>
