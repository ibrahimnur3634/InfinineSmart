<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Infinine Smart Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020817;
      --panel: #0f172a;
      --panel-strong: #111827;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-2: #16a34a;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --red: #f87171;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #020817, #0f172a 50%, #111827);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      background: rgba(2, 8, 23, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
    }

    .logout-btn {
      border: 1px solid rgba(248, 113, 113, 0.4);
      background: rgba(248, 113, 113, 0.08);
      color: #fecaca;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 20px 60px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.25);
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 800;
      color: white;
    }

    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: var(--blue); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red { color: var(--red); }

    .content {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 22px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 18px;
    }

    .recent-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.35);
    }

    .list-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .pill.new { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); color: #bae6fd; }
    .pill.pending { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #fde68a; }
    .pill.complete { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.35); color: #bbf7d0; }

    .chart-wrap {
      margin-top: 18px;
      display: flex;
      align-items: end;
      gap: 10px;
      height: 170px;
      padding-top: 10px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .bar {
      width: 100%;
      max-width: 46px;
      min-height: 18px;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, #22c55e, #0ea5e9);
    }

    .bar-label {
      color: var(--muted);
      font-size: 11px;
    }

    .mini-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }

    .summary-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.35);
      color: var(--text);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
    }

    @media (max-width: 860px) {
      .content { grid-template-columns: 1fr; }
      .topbar { flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">INFININE</div>
    <div class="actions">
      <div class="status">Admin session active</div>
      <button class="logout-btn" type="button" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="card">
        <span class="stat-label">Total revenue</span>
        <div class="stat-value green" id="totalRevenue">KSh 0</div>
      </div>
      <div class="card">
        <span class="stat-label">Orders</span>
        <div class="stat-value blue" id="totalOrders">0</div>
      </div>
      <div class="card">
        <span class="stat-label">Pending</span>
        <div class="stat-value amber" id="pendingOrders">0</div>
      </div>
      <div class="card">
        <span class="stat-label">Completed</span>
        <div class="stat-value red" id="completedOrders">0</div>
      </div>
    </section>

    <section class="content">
      <div class="card">
        <div class="panel-title">
          <span>Recent orders</span>
        </div>
        <ul class="recent-list" id="orderList"></ul>
      </div>

      <div>
        <div class="mini-card">
          <div class="panel-title">
            <span>Sales overview</span>
          </div>
          <div class="chart-wrap" id="salesChart"></div>
        </div>

        <div class="mini-card" style="margin-top: 22px;">
          <div class="panel-title">
            <span>Order summary</span>
          </div>
          <div class="summary-box">
            <div class="summary-row"><span>New</span><strong id="summaryNew">0</strong></div>
            <div class="summary-row"><span>Pending</span><strong id="summaryPending">0</strong></div>
            <div class="summary-row"><span>Completed</span><strong id="summaryCompleted">0</strong></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_USERNAME = 'infininekenya';
    const SESSION_KEY = 'infinineAdminSession';
    const ORDER_KEY = 'infinineOrders';
    const ADMIN_SESSION_TTL_MS = 10 * 60 * 1000;

    function readSession() {
      const session = localStorage.getItem(SESSION_KEY);
      if (!session) return null;
      try {
        const parsed = JSON.parse(session);
        if (!parsed || parsed.username !== ADMIN_USERNAME || parsed.expiresAt <= Date.now()) {
          localStorage.removeItem(SESSION_KEY);
          return null;
        }
        return parsed;
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    function ensureAccess() {
      if (!readSession()) {
        window.location.href = 'admn.html';
      }
    }

    function getOrders() {
      try {
        const raw = localStorage.getItem(ORDER_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        return [];
      }
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(value || 0);
    }

    function getStatusClass(status) {
      const safe = (status || '').toLowerCase();
      if (safe === 'new') return 'new';
      if (safe === 'pending') return 'pending';
      return 'complete';
    }

    function getLastSixMonthsChart(orders) {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const values = Array(6).fill(0);

      if (!orders.length) {
        return { monthNames: monthNames.slice(-6), values };
      }

      const now = new Date();
      const lastSix = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        lastSix.push({ monthIndex: d.getMonth(), label: monthNames[d.getMonth()] });
      }

      orders.forEach(order => {
        const created = order.createdAt ? new Date(order.createdAt) : new Date();
        const index = lastSix.findIndex(item => item.monthIndex === created.getMonth() && created.getFullYear() === now.getFullYear());
        if (index >= 0) {
          values[index] += Number(order.amount) || 0;
        }
      });

      return { monthNames: lastSix.map(item => item.label), values };
    }

    function renderDashboard() {
      const orders = getOrders();
      const totalOrders = orders.length;
      const totalRevenue = orders.reduce((sum, order) => sum + (Number(order.amount) || 0), 0);
      const pending = orders.filter(order => String(order.status).toLowerCase() === 'pending').length;
      const completed = orders.filter(order => String(order.status).toLowerCase() === 'completed').length;

      document.getElementById('totalRevenue').textContent = formatCurrency(totalRevenue);
      document.getElementById('totalOrders').textContent = totalOrders;
      document.getElementById('pendingOrders').textContent = pending;
      document.getElementById('completedOrders').textContent = completed;
      document.getElementById('summaryNew').textContent = orders.filter(order => String(order.status).toLowerCase() === 'new').length;
      document.getElementById('summaryPending').textContent = pending;
      document.getElementById('summaryCompleted').textContent = completed;

      const list = document.getElementById('orderList');
      if (!orders.length) {
        list.innerHTML = '<li class="empty">No orders have been received yet. The dashboard is currently in construction mode.</li>';
      } else {
        list.innerHTML = orders.slice(0, 6).map(order => `
          <li class="list-item">
            <div>
              <strong>${(order.customer || 'Customer').replace(/</g, '&lt;')}</strong>
              <div class="meta">${(order.service || 'Service').replace(/</g, '&lt;')} • ${new Date(order.createdAt || Date.now()).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="meta">${formatCurrency(order.amount || 0)}</div>
              <span class="pill ${getStatusClass(order.status)}">${(order.status || 'New')}</span>
            </div>
          </li>
        `).join('');
      }

      const salesChart = document.getElementById('salesChart');
      const { monthNames, values } = getLastSixMonthsChart(orders);
      const max = Math.max(...values, 1);

      salesChart.innerHTML = monthNames.map((month, index) => `
        <div class="bar-col">
          <div class="bar" style="height: ${(values[index] / max) * 100}%"></div>
          <div class="bar-label">${month}</div>
        </div>
      `).join('');
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      window.location.href = 'admn.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
    ensureAccess();
    renderDashboard();
  </script>
</body>
</html>
