<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinine Assistant</title>
  <style>
    :root {
      --bg: #081420;
      --panel: #0f172a;
      --panel-strong: #111827;
      --line: rgba(148, 163, 184, 0.22);
      --primary: #22c55e;
      --primary-2: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --user: linear-gradient(135deg, #22c55e, #0ea5e9);
      --bot: #11263d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #020817 0%, #0b1220 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .widget {
      width: min(420px, 100%);
      min-height: 560px;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.5);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.15), rgba(59, 130, 246, 0.15));
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06203a;
      font-weight: 800;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(2, 6, 23, 0.8);
    }

    .message {
      max-width: 90%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      color: #062028;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid rgba(125, 211, 252, 0.12);
      border-bottom-left-radius: 4px;
    }

    .message a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.98);
    }

    .composer input {
      flex: 1;
      border: 1px solid rgba(125, 211, 252, 0.18);
      background: rgba(2, 6, 23, 0.8);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    .composer button {
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      color: #021119;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <div class="brand">
        <span class="avatar">I</span>
        <span>Infinine Assistant</span>
      </div>
      <div class="status">Online</div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="chatForm" class="composer">
      <input id="messageInput" type="text" placeholder="Ask about services, owner, or contacts..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chatForm');
    const inputEl = document.getElementById('messageInput');
    const API_BASE = 'http://localhost:3000';

    function addMessage(type, text) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerHTML = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function sendQuestion() {
      const question = inputEl.value.trim();
      if (!question) return;

      addMessage('user', escapeHtml(question));
      inputEl.value = '';

      const response = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: question, sessionId: 'widget-session' })
      });

      if (!response.ok) {
        addMessage('bot', 'The assistant is unavailable right now. Please try again later.');
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let replyText = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';

        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;

          try {
            const payload = JSON.parse(line.replace(/^data:\s*/, ''));
            if (payload.type === 'token' && payload.text) {
              replyText += payload.text;
              const last = messagesEl.lastElementChild;
              if (last && last.classList.contains('bot')) {
                last.innerHTML = escapeHtml(replyText).replace(/\n/g, '<br>');
              } else {
                const div = document.createElement('div');
                div.className = 'message bot';
                div.innerHTML = escapeHtml(payload.text).replace(/\n/g, '<br>');
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            }

            if (payload.type === 'done') {
              const last = messagesEl.lastElementChild;
              if (last && last.classList.contains('bot')) {
                last.innerHTML = escapeHtml(payload.answer || replyText).replace(/\n/g, '<br>');
              }
            }
          } catch (error) {
            // Ignore malformed chunks.
          }
        }
      }
    }

    formEl.addEventListener('submit', function (event) {
      event.preventDefault();
      sendQuestion();
    });

    addMessage('bot', 'Hi! I can answer questions about the site, ownership, contacts, and services.');
  </script>
</body>
</html>
